name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, minsize]

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            qemu-system-arm cmake ninja-build gdb-multiarch

      - name: Tool versions
        run: |
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Size report
        run: |
          find build/${{ matrix.preset }} -name '*.elf' -print0 \
            | xargs -0 -r arm-none-eabi-size

      - name: Smoke + regression tests (QEMU)
        run: ./tests/smoke-test.sh ${{ matrix.preset }}

      - name: Build probes (libgcc ordering, FLASH load bounds)
        run: ./tests/build-probes.sh ${{ matrix.preset }}

      - name: Markdown link check
        run: python3 tests/check-links.py

      - name: Lesson 12 debugger and measurement checks
        run: python3 tests/lesson12-check.py ${{ matrix.preset }}

      - name: Lesson 13 synchronization, FP context and ABI checks
        run: python3 tests/lesson13-check.py ${{ matrix.preset }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/**/*.elf
            build/${{ matrix.preset }}/**/*.bin
            build/${{ matrix.preset }}/**/*.map
            build/${{ matrix.preset }}/lesson12-evidence/
            build/${{ matrix.preset }}/lesson13-evidence/
          if-no-files-found: warn
