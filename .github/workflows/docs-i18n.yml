name: Bilingual documentation validation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/documentation-*.json'
      - 'tests/check-docs.py'
      - 'tests/test-check-docs.py'
      - 'tests/check-links.py'
      - '.github/workflows/docs-i18n.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/documentation-*.json'
      - 'tests/check-docs.py'
      - 'tests/test-check-docs.py'
      - 'tests/check-links.py'
      - '.github/workflows/docs-i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout complete history for protected Turkish-source hashes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify bilingual coverage, preservation and language routing
        run: python3 -B tests/check-docs.py
      - name: Run negative documentation gate regressions
        run: python3 -B tests/test-check-docs.py
      - name: Check all Markdown relative links
        run: python3 -B tests/check-links.py
      - name: Check whitespace and patch integrity
        run: git diff --check HEAD^ HEAD
